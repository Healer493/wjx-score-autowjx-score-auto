name: 成绩查询页自动同步

# GitHub Actions 的 cron 用 UTC，北京时间 = UTC + 8
# 08:00 / 12:00 / 18:00（北京时间） -> 00:00 / 04:00 / 10:00 UTC
on:
  schedule:
    - cron: '0 0,4,10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wjx-score-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-liberation fontconfig
          fc-cache -f

      - name: 安装 Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: 抓数 + 出证书 + 打包
        env:
          WJX_API_KEY: ${{ secrets.WJX_API_KEY }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python run_cloud.py

      - name: 提交到 docs/（GitHub Pages 自动发布）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "自动更新成绩页 $(date -u +'%F %H:%M') UTC"
            git push
          fi
